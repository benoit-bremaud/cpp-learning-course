@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act — Aucun composant disponible
start
:Initialiser component_count à 0;
:Initialiser components_per_kit à 4;
:Calculer le quotient entier\ncomponent_count / components_per_kit\nRésultat : 0;
:Initialiser kit_count à 0;
stop
@enduml

