@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act - Constante valide\nBesoin non respecté
start
:Initialiser l'entier constant\nmeasurement_limit à 30;
:Initialiser\nmeasurement_count à 0;
:Écrire la limite,\npuis le compteur,\nchacun sur sa ligne;
:Affecter 1 à\nmeasurement_count;
:Écrire la limite,\npuis le compteur,\nchacun sur sa ligne;
:Renvoyer 0;
stop
@enduml

