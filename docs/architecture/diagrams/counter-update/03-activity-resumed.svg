@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act — Reprendre un compteur à cinq
start
:Initialiser measurement_count à 5;
:Calculer measurement_count + 1\nRésultat : 6;
:Affecter 6 à measurement_count;
:Calculer measurement_count + 1\nRésultat : 7;
:Affecter 7 à measurement_count;
stop
@enduml

