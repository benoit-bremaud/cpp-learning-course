@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act — Deux chemins et une suite commune — identifier
start
:Initialiser expected_identifier à 7;
:Initialiser observed_identifier à 9;
:Évaluer observed_identifier == expected_identifier;
:Initialiser identifier_matched avec la réponse;
if (Choisir le chemin) then ([identifier_matched])
  :Écrire Identifier matched\net un saut de ligne;
else ([not identifier_matched])
  :Écrire Identifier not matched\net un saut de ligne;
endif
:Écrire Check finished\net un saut de ligne;
:Renvoyer 0;
stop
@enduml

