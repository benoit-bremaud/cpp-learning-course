@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act — Multiplier kits et composants par kit
start
:Initialiser kit_count à 3;
:Initialiser components_per_kit à 4;
:Calculer kit_count * components_per_kit\nRésultat : 12;
:Initialiser component_count\navec le résultat : 12;
stop
@enduml

