e style="stroke: #A80036; stroke-width: 1.5;" x1="44" x2="44" y1="210.3562" y2="470.1284"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="44" x2="234.5" y1="470.1284" y2="470.1284"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="234.5" x2="234.5" y1="470.1284" y2="490.1284"/><polygon fill="#A80036" points="230.5,480.1284,234.5,490.1284,238.5,480.1284,234.5,484.1284" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="234.5" x2="234.5" y1="175.3761" y2="198.3562"/><polygon fill="#A80036" points="230.5,188.3562,234.5,198.3562,238.5,188.3562,234.5,192.3562" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="234.5" x2="234.5" y1="553.7125" y2="573.7125"/><polygon fill="#A80036" points="230.5,563.7125,234.5,573.7125,238.5,563.7125,234.5,567.7125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="234.5" x2="234.5" y1="615.5045" y2="635.5045"/><polygon fill="#A80036" points="230.5,625.5045,234.5,635.5045,238.5,625.5045,234.5,629.5045" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[93d4cff74ff26663ba6364c97acff1e2]
@startuml
skinparam defaultFontSize 16
skinparam shadowing false
title act — Répéter jusqu'à la limite — valeur déjà excessive
start
:Initialiser measurement_limit à 3;
:Initialiser measurement_count à 4;
while (measurement_count < measurement_limit ?) is ([true])
  :Calculer measurement_count + 1;
  :Affecter le résultat à measurement_count;
  :Écrire measurement_count\net un saut de ligne;
endwhile ([false])
:Écrire Loop finished\net un saut de ligne;
:Renvoyer 0;
stop
@enduml

